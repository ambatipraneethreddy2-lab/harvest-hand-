# Render Blueprint: in the Render dashboard choose New > Blueprint and select this repo.
# Free plan note: the disk is temporary, so the SQLite database and uploaded photos
# reset when the service restarts or redeploys. Fine for a demo; use Postgres for real use.
services:
  - type: web
    name: harvest-hand
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false
